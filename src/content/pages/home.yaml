about:
  eyebrow: Meet Chelsea
  title: Strength *with* ease.
  paragraphs:
    - 'I’m Chelsea, a BASI-certified Pilates instructor teaching one-to-one online. For more than five years I’ve taught people who carry a lot: leaders, travellers, new mothers, bodies in pain.'
    - I blend Pilates with myofascial and somatic work, so you build real strength while your nervous system learns to settle.
