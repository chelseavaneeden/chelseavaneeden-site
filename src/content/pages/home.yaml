perfectFor:
  title: Perfect for *those who*…
  items:
    - Worry about chronic pain, injury and proper form
    - Own a Reformer Pilates machine, gathering dust
    - Feel overstimulated by gyms/studios, prefer to train at home
    - Need consistency, have a busy schedule
    - Are rebuilding strength after pregnancy or surgery
    - Feel stressed or anxious, and want movement that feels calming
investment:
  title: Start with your *intro pack*.
  note: After your intro pack, continue with a monthly package, from €260 a month.
about:
  title: Hi, I’m *Chelsea*.
  paragraphs:
    - My teaching style is calm, caring and collaborative. Blending Pilates and somatic techniques to help you release tension, move better and feel more energised.
    - As a BASI Comprehensive Pilates Instructor, I continue learning about the connections between stress, movement and chronic pain. Specialising in movement for mental health.
  image: ../../assets/media/chelsea-portrait.jpg
  imageAlt: Chelsea van Eeden smiling and waving during an online session
