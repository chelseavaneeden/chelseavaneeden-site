perfectFor:
  title: You’re in the right place *if you…*
  items:
    - Experience chronic pain, and worry about injury and proper form
    - Need workouts modified for your stress and energy levels
    - Feel overstimulated by gyms/studios or prefer to train at home
    - Are rebuilding strength after pregnancy or surgery
    - Have a busy schedule and need accountability/consistency
    - Want Online Reformer Pilates Classes
investment:
  title: Start with your *intro session*
  note: After your intro session, continue with a monthly package, from €260 a month.
about:
  title: Hi, I’m *Chelsea*
  paragraphs:
    - My teaching style is calm, caring and collaborative. Blending Pilates and somatic techniques to help you release tension, move better and feel more energised.
    - As a BASI Comprehensive Pilates Instructor, I continue learning about the connections between stress, movement and chronic pain. Specialising in movement for mental health.
  image: ../../assets/media/chelsea-portrait.jpg
  imageAlt: Chelsea van Eeden smiling and waving during an online session
expect:
  title: What you can expect *from me*
  items:
    - I’ll explain how and why we do each exercise
    - No judgement, all sessions are collaborative and supportive
    - If something isn’t working, we’ll modify and find another way
    - My goal is to help you learn how to move better and need me less
