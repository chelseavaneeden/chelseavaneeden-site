perfectFor:
  title: Perfect for *those who*…
  items:
    - Worry about injury, chronic pain & improper form
    - Need consistency, but have a busy schedule
    - Overstimulated by gyms/studios, prefer at-home exercise
    - Have a Reformer Pilates machine, gathering dust
    - Are pregnant, or rebuilding your core after birth
    - Feel stressed or anxious, and want movement that calms
investment:
  title: Start with your *intro pack*.
  note: After your intro pack, continue weekly or twice weekly from €260 a month.
steps:
  title: How it *works*.
  items:
    - title: Book your intro pack
      text: Pay securely online in a minute.
    - title: Pick your times
      text: Choose session times that suit your week from my calendar.
    - title: Assessment
      text: In our first session we look at how you move, any pain or injuries, and what you want to change.
    - title: Your plan
      text: I build a programme around your body, your goals and your schedule.
about:
  title: Hi, I’m *Chelsea*.
  paragraphs:
    - My teaching style blends somatics, stress relief and Pilates. I help new parents, frequent travellers and busy professionals feel less stressed, more mobile and energised after every session.
    - As a BASI Comprehensive Pilates Instructor, I specialise in movement for mental health. I know first-hand what stress, anxiety and chronic pain do to the body, so every session is calm, precise and built around how you feel that day.
  image: ../../assets/media/chelsea-portrait.jpg
  imageAlt: Chelsea van Eeden smiling and waving during an online session
