perfectFor:
  title: Perfect for *those who*…
  items:
    - Worry about chronic pain, injury and proper form
    - Own a Reformer Pilates machine, gathering dust
    - Feel overstimulated by gyms/studios, prefer to train at home
    - Need consistency, have a busy schedule
    - Are rebuilding strength after pregnancy or surgery
    - Feel stressed or anxious, and want movement that feels calming
investment:
  title: Start with your *intro pack*.
  note: After your intro pack, continue with a monthly package, from €260 a month.
steps:
  title: How it *works*.
  items:
    - title: Book your intro pack
      text: Pay securely online via Stripe.
    - title: Pick your times
      text: You'll receive an email with a link to book your sessions.
    - title: First session
      text: From your first session, we'll see how you're moving and chat about your goals for upcoming sessions.
    - title: Your plan
      text: I'll create a personalised plan around your goals and schedule.
about:
  title: Hi, I’m *Chelsea*.
  paragraphs:
    - I have spent the past decade learning about the effects of stress, anxiety and chronic pain. My teaching style blends Pilates and somatic techniques to help you release tension, move better and feel more energised.
    - As a BASI Comprehensive Pilates Instructor, I specialise in movement for mental health. Every session is about you! Connected, collaborative and personalised to your needs on the day.
  image: ../../assets/media/chelsea-portrait.jpg
  imageAlt: Chelsea van Eeden smiling and waving during an online session
ctaBand:
  title: Ready when *you* are.
  text: Start your intro pack, to feel the benefits of movement for your mental health.
