about:
  eyebrow: Meet your instructor
  title: Hi, I’m *Chelsea*.
  paragraphs:
    - I’m a BASI Comprehensive Pilates instructor specialising in movement for mental health. When I’m not teaching, you’ll find me baking treats, making coffees, exploring new cities or shaking out stress on the dance floor!
    - I have a busy-brain (peep the sticky-notes) and fully understand the struggles of mental health, chronic stress and anxiety.
    - My teaching style blends my love for somatics, stress relief and Pilates to support busy professionals, travellers, new mothers and clients to feel stronger, more mobile and energised after every session.
  image: ../../assets/media/chelsea-portrait.jpg
  imageAlt: Chelsea van Eeden smiling and waving during an online session
