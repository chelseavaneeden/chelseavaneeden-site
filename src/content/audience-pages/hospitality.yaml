title: Retreats & events
audience: hospitality
sectionColour: golden
headerLight: golden
seo:
  title: Pilates for retreats, events & teams · Chelsea van Eeden
  description: Mixed-level, feel-good Pilates for wellness retreats, festivals, events, teams and brands, with a BASI Comprehensive instructor based in Lisbon. Available across Europe and South Africa.
hero:
  title: Feel-good Pilates for your ==retreat or event==
  lede: Bespoke mixed-level Pilates sessions for your wellness retreats and events. Based in Lisbon, available across Europe and South Africa.
  primary:
    label: Request a proposal
    href: '#enquire'
  # Photo shown if the video is removed.
  image: ../../assets/media/chelsea-portrait.jpg
  imageAlt: Moments from a group Pilates class
  imageFocus: center
  # Chelsea's video (28 Oct). The poster is a still from it, shown while the video loads.
  video:
    src: /media/retreats-teaching.mp4
    poster: /media/retreats-teaching-poster.jpg
    speed: 1
  layout: split
whoFor:
  title: Perfect for *retreats that…*
  items:
    - Want feel-good, mixed-level Pilates for all ages and stages
    - Value a calm, caring and collaborative instructor
    - Want guests feeling grounded, energised and cared for after the session
    - Prefer a class that blends Pilates strength with somatic techniques
steps:
  title: How it *works*
  items:
    - title: Tell me about your event
      text: Dates, location, group size and the feel you're after.
    - title: Your proposal
      text: I reply with a tailored proposal within 48 hours.
    - title: We plan it together
      text: Session lengths, levels and space, planned around your schedule.
    - title: I teach
      text: A bespoke, feel-good Pilates session that will elevate your event and guest experience.
proof:
  title: What hosts *say*
faq:
  title: Good to *know*
  items:
    - question: Where can you teach?
      answer: I'm based in Lisbon and travel across Europe and South Africa.
    - question: Is it suitable for beginners?
      answer: Yes. Sessions are mixed-level and beginner-friendly, with options to make every exercise easier or harder.
    - question: How much does it cost?
      answer: Each experience is tailored to the event and its needs. Sessions start at €150, with room to explore collaborations that feel meaningful and aligned.
    - question: How far ahead should I get in touch?
      answer: As early as you can, especially for peak retreat and festival season.
enquiry:
  title: Request a *proposal*
  intro: Tell me about your retreat or event, and I'll reply with a tailored proposal within 48 hours.
