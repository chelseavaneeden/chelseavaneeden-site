whoFor:
  title: Perfect for *retreats that…*
  items:
    - Want feel-good, mixed-level Pilates for all ages and stages
    - Value a calm, caring and collaborative instructor
    - Want guests feeling grounded, energised and cared for after the session
    - Prefer a class that blends Pilates strength with somatic techniques
investment:
  title: Shall we *begin?*
steps:
  title: How it *works*
  items:
    - title: Tell me about your event
      text: Share your dates, location, group size and the feel you’d like. We can
        start with a short call if that’s easier, with no cost and no
        obligation.
    - title: Your proposal
      text: Within 2 working days, you’ll receive a tailored proposal with class
        lengths, timings, what’s included and one clear price.
    - title: Your plan for the day
      text: Once you’re happy, I’ll send a one-page plan with timings, space, mats and
        props, a short health note for your guests and an indoor option for
        outdoor classes.
    - title: On the day, and after
      text: I arrive early to set up and welcome your guests, shape the class to every
        level in the room, and send a few simple moves they can take home.
proof:
  title: What hosts *say*
faq:
  title: Good to *know*
  items:
    - question: Where can you teach?
      answer: I’m based in Lisbon and travel across Europe and South Africa.
    - question: Is it suitable for beginners?
      answer: Yes. Sessions are mixed-level and beginner-friendly, with options to
        make every exercise easier or harder.
    - question: How much does it cost?
      answer: Each experience is tailored to the event and its needs. Sessions start
        at €150, with room to explore collaborations that feel meaningful and
        aligned. Rates exclude travel and accommodation, which the organiser
        covers.
    - question: Do you bring mats and props?
      answer: No, the venue or organiser arranges mats and any props. If you need
        them, I’m happy to connect you with brands and suppliers of high-quality
        Pilates Equipment.
    - question: How far ahead should I get in touch?
      answer: As early as you can, especially for peak retreat and festival season.
  link:
    label: Request a proposal
    href: "#enquire"
enquiry:
  title: Request a *proposal*
  intro: Tell me about your retreat or event, and I’ll reply with a tailored
