investment:
  title: Shall we *begin?*
steps:
  title: How it *works*
  items:
    - title: Tell me about your event
      text: Dates, location, group size and the feel you’re after.
    - title: Your proposal
      text: I reply with a tailored proposal within 2 working days.
    - title: We plan it together
      text: Session lengths, levels and space, planned around your schedule.
    - title: I teach
      text: A bespoke, feel-good Pilates session that will elevate your event and guest experience.
proof:
  title: What hosts *say*
faq:
  title: Good to *know*
  # Button under the questions: back up to the proposal form.
  link:
    label: Request a proposal
    href: '#enquire'
  items:
    - question: Where can you teach?
      answer: I’m based in Lisbon and travel across Europe and South Africa.
    - question: Is it suitable for beginners?
      answer: Yes. Sessions are mixed-level and beginner-friendly, with options to make every exercise easier or harder.
    - question: How much does it cost?
      answer: Each experience is tailored to the event and its needs. Sessions start at €150, with room to explore collaborations that feel meaningful and aligned. Rates exclude travel and accommodation, which the organiser covers.
    - question: Do you bring mats and props?
      answer: No, the venue or organiser arranges mats and any props. If you need them, I’m happy to recommend suppliers and put you in touch.
    - question: How far ahead should I get in touch?
      answer: As early as you can, especially for peak retreat and festival season.
enquiry:
  title: Request a *proposal*
  intro: Tell me about your retreat or event, and I’ll reply with a tailored proposal within 2 working days.
