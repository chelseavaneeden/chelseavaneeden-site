proof:
  title: What hosts *say*.
faq:
  title: Good to *know*.
  items:
    - question: Where can you teach?
      answer: I'm based in Lisbon and travel across Europe and South Africa.
    - question: Is it suitable for beginners?
      answer: Yes. Sessions are mixed-level and beginner-friendly, with options to make every exercise easier or harder.
    - question: How much does it cost?
      answer: Whether it’s an intimate retreat, a festival, or a corporate gathering, each experience is tailored to the event and its needs. Sessions start at €150, with room to explore collaborations that feel meaningful and aligned.
    - question: How far ahead should I get in touch?
      answer: As early as you can, especially for peak retreat and festival season.
enquiry:
  title: Request a *proposal*.
  intro: Tell me about your retreat or event, and I'll reply with a tailored proposal within 48 hours.
