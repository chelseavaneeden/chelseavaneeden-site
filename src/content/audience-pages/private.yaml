faq:
  eyebrow: Questions
  title: Good to *know*.
  items:
    - question: Do I need any experience?
      answer: No. Sessions start where you are, whether you’ve never done Pilates or have practised for years.
    - question: What do I need for online sessions?
      answer: A mat, a little floor space and a laptop or tablet with a camera. I’ll suggest a few small props if they would help. If you have a Reformer at home, we can use it.
    - question: I have an injury or pain. Is this right for me?
      answer: |-
        Often, yes. I specialise in rehab and chronic pain, and I’m happy to work alongside your physiotherapist or doctor.

        Tell me about it when you book. If something else would serve you better first, I’ll say so.
    - question: Is it safe during pregnancy?
      answer: Yes, with the right adaptations. I’m trained in pre and post-natal Pilates and adjust every session to your stage and how you feel. Please check with your midwife or doctor before you start.
    - question: How long is a session?
      answer: Each private session lasts 45 to 55 minutes, depending on what you need.
    - question: Where is the Lisbon studio?
      answer: It’s a private Reformer studio in Lisbon. You’ll receive the address when you book.
    - question: Can I cancel or reschedule?
      answer: Yes, with at least 24 hours’ notice. Late cancellations and missed sessions are charged in full.
    - question: What happens after my intro pack?
      answer: We look back at your progress together and agree the right rhythm, weekly or twice weekly. Start a monthly plan within 14 days of your intro pack and you save €40 on your first month.
    - question: How do I pay?
      answer: Securely online by card. Monthly plans are billed once a month.
