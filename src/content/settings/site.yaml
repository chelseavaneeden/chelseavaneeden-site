introPack:
  title: Book your *intro pack*.
  points:
    - Pay securely online.
    - Pick your session times from my calendar.
    - Meet me online for your first session and assessment.
  stripePricingTableId: prctbl_1UTTWqDYbuP8YMkh2npobpyB
monthlyPlans:
  title: Continue with *me*.
  intro: For clients continuing after their intro pack. Choose 1 or 2 private sessions a week, at a regular time that suits you.
  # Add the ID of a second pricing table with the monthly plans.
  stripePricingTableId:
  noTableText: To continue, message me and I'll set up your monthly plan.
welcome:
  title: Thank you, *let's begin*.
  intro: Your intro pack is booked. Two quick steps and we're ready for your first session.
  bookingTitle: 1. Pick your session times
  bookingText: Choose times that suit your week. Use your 4 sessions within 2 months.
  bookingHref:
  bookingLabel: Choose your times
  bookingFallback: I'll email you within one working day to arrange your times.
  intakeTitle: 2. Tell me about you
  intakeText: A few questions so I can plan your first session around your body.
contact:
  whatsappHref: https://wa.link/ccq3ib
  whatsappLabel: Message me on WhatsApp
enquiry:
  nameLabel: Name
  emailLabel: Email
  replyPromise: I reply personally within one working day.
  privacyNote: I only use your details to reply to you.
  success: Thank you, your message is on its way. I'll reply by email soon.
  error: Sorry, that didn't send. Please try again in a moment, or message me on WhatsApp.
  # From Cloudflare → Turnstile. Leave empty until the widget is set up.
  turnstileSiteKey:
  forms:
    question:
      title: Ask me a *question*.
      intro: Not sure the intro pack is right for you? Ask me anything.
      fields:
        - name: message
          label: Your question
          type: textarea
          required: true
          placeholder: e.g. I have lower back pain. Is the intro pack right for me?
      button: Send my question
    proposal:
      title: Request a *proposal*.
      questions:
        - label: I'm planning
          short: Planning
          options:
            - Retreat
            - Event or festival
            - Team wellbeing
            - Brand collaboration
            - Something else
        - label: When?
          short: When
          options:
            - Within 1 month
            - 1–3 months
            - 3–6 months
            - 6+ months / flexible
        - label: Where?
          short: Where
          options:
            - Portugal
            - Rest of Europe
            - South Africa
            - Elsewhere
        - label: Group size
          short: Group size
          options:
            - Under 10
            - 10–25
            - 25–50
            - 50+
      fields:
        - name: organisation
          label: Organisation or event
          type: text
          required: false
        - name: info
          label: More information
          type: textarea
          required: false
          placeholder: Dates, venue, ideas…
      button: Request my proposal
    intake:
      title: Tell me about *you*.
      questions:
        - label: Mat or Reformer?
          short: Equipment
          options:
            - Mat
            - Reformer at home
            - Not sure yet
      fields:
        - name: location
          label: Where are you, and what's your time zone?
          type: text
          required: true
          placeholder: e.g. London, UK time
        - name: goals
          label: What would you like to work on?
          type: textarea
          required: true
        - name: health
          label: Any injuries, pain, pregnancy or health conditions I should know about?
          type: textarea
          required: false
      consent: I agree that Chelsea can use this health information to plan my sessions.
      button: Send to Chelsea
