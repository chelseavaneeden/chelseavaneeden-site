introPack:
  title: Book your Session
  points:
    - Choose a time that suits you
    - Pay securely to confirm it
    - Meet me online for your first session
  # Google Calendar → the Intro session booking page → Share → Website embed → Inline booking page: the address in src="…".
  bookingPageUrl: https://calendar.google.com/calendar/appointments/schedules/AcZssZ1GHwno7TWcl91K_w1cG4URfLcMNFg3Nv5AwXeByViGISCS-lg84nHWz4e7CSh0lxeXDIdydygL?gv=true
  bookingButton: See available times
  bookingNote: Need a different time? You can reschedule up to 24 hours before.
  emailNote: After booking you’ll get a short form to fill in, and my occasional emails for private clients. Unsubscribe any time.
  # Only shown while there is no booking page link above.
  stripePricingTableId: prctbl_1UTTWqDYbuP8YMkh2npobpyB
monthlyPlans:
  title: Continue with *me*
  intro: For clients continuing after their intro session. Choose 1 or 2 private sessions a week, at a regular time that suits you.
  # Add the ID of a second pricing table with the monthly plans.
  stripePricingTableId:
  noTableText: To continue, message me and I’ll set up your monthly plan.
welcome:
  title: Thank you, *you’re booked*
  intro: One quick step before we meet. Tell me a little about you, so I can plan your first session around your body. It takes about 3 minutes.
  intakeTitle: Tell me about you
contact:
  whatsappHref: https://wa.link/ccq3ib
  whatsappLabel: Message me on WhatsApp
enquiry:
  nameLabel: Name
  emailLabel: Email
  missingLead: 'Still needed:'
  missingTick: The tick box
  replyPromise: I reply personally within one working day.
  privacyNote: I only use your details to reply to you.
  success: Thank you, your message is on its way. I’ll reply by email soon.
  error: Sorry, that didn’t send. Please try again in a moment, or message me on WhatsApp.
  # From Cloudflare → Turnstile. Leave empty until the widget is set up.
  turnstileSiteKey:
  forms:
    question:
      title: Ask me a *question*
      intro: Not sure the intro session is right for you? Ask me anything.
      fields:
        - name: message
          label: Your question
          type: textarea
          required: true
          placeholder: e.g. I have lower back pain. Is the intro session right for me?
      button: Send my question
    proposal:
      title: Request a *proposal*
      questions:
        - label: I’m planning
          short: Planning
          options:
            - Retreat
            - Event
            - Brand collaboration
            - Something else
        - label: When?
          short: When
          required: false
          options:
            - Within 1 month
            - 1–3 months
            - 3–6 months
            - 6+ months / flexible
        - label: Where?
          short: Where
          options:
            - Portugal
            - Rest of Europe
            - South Africa
            - Elsewhere
        - label: Group size
          short: Group size
          required: false
          options:
            - Under 10
            - 10–25
            - 25–50
            - 50+
      fields:
        - name: info
          label: More information or questions
          type: textarea
          required: false
          placeholder: Dates, venue, ideas…
      button: Request my proposal
    intake:
      title: Tell me about *you*
      emailHint: Use the email you booked with.
      # The field ids (name) also set where each answer goes in Notion.
      fields:
        - name: birthday
          label: Date of birth
          type: date
          required: true
        - name: phone
          label: Phone
          type: tel
          required: false
        - name: location
          label: Where are you, and what’s your time zone?
          type: text
          required: true
          placeholder: e.g. London, UK time
        - name: emergency
          label: Emergency contact, name and number
          type: text
          required: true
          placeholder: e.g. Sam Smith, +44 7700 900000
        - name: pain
          label: Any pain or discomfort? Tap all that apply
          type: choice
          multiple: true
          required: true
          options:
            - None
            - Neck
            - Shoulders
            - Upper back
            - Lower back
            - Hips
            - Knees
            - Ankles & feet
            - Wrists & hands
            - Elbows
            - Other
        - name: health
          label: Injuries, surgeries, health conditions or pregnancy, old and recent
          type: textarea
          required: true
          placeholder: e.g. knee surgery in 2021, or none
        - name: medication
          label: Medication or treatment
          type: text
          required: true
          placeholder: e.g. none
        - name: movement
          label: What movement do you do now?
          type: text
          required: true
          placeholder: e.g. walking, yoga once a week
        - name: goals
          label: Your goals, tap 1 or more
          type: choice
          multiple: true
          required: true
          options:
            - Strength
            - Flexibility & mobility
            - Rehabilitation
            - Pre/postnatal
            - Other
        - name: equipment
          label: Mat or Reformer?
          type: choice
          required: true
          options:
            - Mat
            - Reformer at home
            - Not sure yet
        - name: notes
          label: Anything else I should know?
          type: textarea
          required: false
      agreements:
        - text: I’ve read and agree to the [Terms](/terms), including the health and liability sections.
          short: Terms
        - text: I agree that Chelsea can use this health information to plan my sessions. [Privacy policy](/privacy)
          short: Health consent
      button: Send to Chelsea
