# Pages CMS: the editor Chelsea uses at https://app.pagescms.org
# Each section below is a menu item in the editor. Fields mirror src/content.config.ts;
# if you add a field there, add it here too.

media:
  input: src/assets/media
  output: ../../assets/media
  rename: safe
  categories: [image]

content:
  # ── HOME PAGE ──────────────────────────────────────────────────────────────
  - name: home
    label: Home page
    type: file
    path: src/content/pages/home.yaml
    format: yaml
    fields:
      - name: seo
        label: Google listing
        type: object
        description: How the page appears in search results and when shared.
        fields:
          - { name: title, label: Page title, type: string, required: true }
          - { name: description, label: Short description, type: text, required: true, description: 'About 150 characters.' }
      - name: hero
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string, description: 'Optional. Leave empty to hide.' }
          - { name: title, label: Headline, type: string, required: true, description: 'Wrap a word in *asterisks* to make it italic, e.g. Quietly *powerful* Pilates. Wrap words in ==double equals== to highlight them in yellow.' }
          - { name: lede, label: Intro sentence, type: text, required: true }
          - name: primary
            label: Main button
            type: object
            fields:
              - { name: label, label: Button text, type: string, required: true }
              - { name: href, label: Link, type: string, required: true, description: 'A page on the site like /book, or a full https:// address.' }
          - name: extra
            label: Second button (optional)
            type: object
            description: 'Outlined button next to the main button. #about jumps to Meet Chelsea.'
            fields:
              - { name: label, label: Button text, type: string }
              - { name: href, label: Link, type: string }
          - name: secondary
            label: Text link (optional)
            type: object
            description: 'Underlined link after the buttons. /enquire opens the Ask me a question pop-up.'
            fields:
              - { name: label, label: Link text, type: string }
              - { name: href, label: Link, type: string, description: 'Type whatsapp to use your WhatsApp link from Site settings (shown with the chat icon).' }
          - { name: meta, label: Small details under the photo, type: string, list: true }
          - { name: image, label: Photo, type: image, required: true }
          - { name: imageAlt, label: Photo description, type: string, required: true, description: 'Describe the photo for people using screen readers.' }
          - name: imageFocus
            label: Photo focus
            type: select
            default: center
            description: 'Which part of the photo stays in view when it is cropped to fit.'
            options:
              values:
                - { value: top, label: Top }
                - { value: upper, label: Upper third }
                - { value: center, label: Centre }
                - { value: lower, label: Lower third }
                - { value: bottom, label: Bottom }
      - name: perfectFor
        label: Perfect for those who…
        type: object
        description: 'Ticked list under the top of the page. Leave the list empty to hide this section.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
          - { name: items, label: Ticks, type: string, list: true }
      - name: about
        label: Meet Chelsea
        type: object
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
          - { name: image, label: Photo, type: image, required: true }
          - { name: imageAlt, label: Photo description, type: string, required: true }
      - name: logos
        label: Logo banner
        type: object
        description: 'Shown under Meet Chelsea, all in one colour. Upload transparent PNG or SVG files (no white box behind the logo). Only add places you have worked with, with their OK. Leave the list empty to hide.'
        fields:
          - { name: label, label: Small line above the logos, type: string, description: 'e.g. Trained & worked with. Leave empty to hide.' }
          - name: items
            label: Logos
            type: object
            list: true
            fields:
              - { name: name, label: Company name, type: string, required: true, description: 'Read out by screen readers.' }
              - { name: image, label: Logo file, type: image, required: true }
      - name: investment
        label: Intro pack section
        type: object
        description: The intro pack card itself is edited under "Offers & prices".
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
          - { name: intro, label: Intro text, type: text }
          - { name: note, label: Line under the card, type: string, description: 'e.g. the ongoing price after the intro pack. Leave empty to hide.' }
      - name: steps
        label: How it works
        type: object
        description: 'Numbered steps under the intro pack. Leave the list empty to hide this section.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
          - name: items
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Step, type: string, required: true }
              - { name: text, label: Text, type: text, required: true }
      - name: ctaBand
        label: Closing band
        type: object
        description: The dark band at the bottom of the page.
        fields:
          - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
          - { name: text, label: Text, type: text }
          - name: primary
            label: Main button
            type: object
            fields:
              - { name: label, label: Button text, type: string, required: true }
              - { name: href, label: Link, type: string, required: true }
          - name: secondary
            label: Second button (optional)
            type: object
            fields:
              - { name: label, label: Button text, type: string }
              - { name: href, label: Link, type: string, description: '/enquire opens the Ask me a question pop-up.' }

  # ── SERVICE PAGES (private sessions, retreats & events, brands, studios & clinics, companies) ─
  - name: audiencePages
    label: Service pages
    type: collection
    path: src/content/audience-pages
    format: yaml
    filename: '{fields.audience}.yaml'
    description: 'One page per audience. Prices come from "Offers & prices" and quotes from "Testimonials" for the same audience.'
    view:
      primary: title
      fields: [title, audience]
    fields:
      - { name: title, label: Page name (only shown in the editor), type: string, required: true }
      - name: audience
        label: Audience
        type: select
        required: true
        options:
          values:
            - { value: private, label: Private clients }
            - { value: companies, label: Companies }
            - { value: hospitality, label: Retreats & Events }
            - { value: studios, label: Studios & Clinics }
            - { value: brands, label: Brands }
      - name: sectionColour
        label: Page mood
        type: select
        default: golden
        description: 'The feel of the page: Golden (warm honey light) or Sage (light green light, linen and leaf shadows).'
        options:
          values:
            - { value: golden, label: Golden }
            - { value: sage, label: Sage }
      - name: seo
        label: Google listing
        type: object
        fields:
          - { name: title, label: Page title, type: string, required: true }
          - { name: description, label: Short description, type: text, required: true, description: 'About 150 characters.' }
      - name: hero
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string, description: 'Optional. Leave empty to hide.' }
          - { name: title, label: Headline, type: string, required: true, description: 'Wrap words in *asterisks* to make them italic, or in ==double equals== to highlight them in yellow.' }
          - { name: lede, label: Intro sentence, type: text, required: true }
          - name: primary
            label: Main button
            type: object
            fields:
              - { name: label, label: Button text, type: string, required: true }
              - { name: href, label: Link, type: string, required: true, description: '#investment jumps to the prices on this page.' }
          - name: secondary
            label: Second button (optional)
            type: object
            fields:
              - { name: label, label: Button text, type: string }
              - { name: href, label: Link, type: string, description: 'Type whatsapp to use your WhatsApp link from Site settings (shown with the chat icon).' }
          - { name: image, label: Photo, type: image, required: true }
          - { name: imageAlt, label: Photo description, type: string, required: true }
          - name: imageFocus
            label: Photo focus
            type: select
            default: center
            description: 'Which part of the photo stays in view when it is cropped to fit.'
            options:
              values:
                - { value: top, label: Top }
                - { value: upper, label: Upper third }
                - { value: center, label: Centre }
                - { value: lower, label: Lower third }
                - { value: bottom, label: Bottom }
          - name: layout
            label: Top section style
            type: select
            default: split
            options:
              values:
                - { value: split, label: Text beside the photo }
                - { value: overlay, label: Full-width photo with a frosted text card }
          - name: textPosition
            label: Text card position (frosted style)
            type: select
            default: left
            options:
              values:
                - { value: left, label: Left }
                - { value: center, label: Centre }
      - name: whoFor
        label: Who it's for
        type: object
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, required: true }
          - { name: intro, label: Intro text, type: text }
          - { name: items, label: Points (one line each, shown with a tick), type: string, list: true, required: true }
      - name: formats
        label: Formats / where we work
        type: object
        description: 'Leave the points empty to hide this section.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: items
            label: Cards
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: text, label: Text, type: text, required: true }
      - name: steps
        label: How it works
        type: object
        description: 'Numbered in order. Leave the steps empty to hide this section.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: items
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: text, label: Text, type: text, required: true }
      - name: investment
        label: Prices section
        type: object
        description: 'Only shown when this audience has published offers under "Offers & prices". Leave the title empty to hide.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro text, type: text }
          - { name: note, label: Small print under the prices, type: string, description: 'Leave empty to hide.' }
      - name: proof
        label: Testimonials heading
        type: object
        description: 'Shows the testimonials tagged for this audience that have permission ticked. The Private sessions version also appears on the home page.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, required: true }
      - name: faq
        label: Questions
        type: object
        description: 'Leave the questions empty to hide this section. The Private sessions questions also appear on the home page.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: items
            label: Questions
            type: object
            list: true
            fields:
              - { name: question, label: Question, type: string, required: true }
              - { name: answer, label: Answer, type: text, required: true, description: 'Leave a blank line to start a new paragraph.' }
          - name: link
            label: Button under the questions (optional)
            type: object
            fields:
              - { name: label, label: Button text, type: string, description: 'e.g. Ask me a question' }
              - { name: href, label: Link, type: string, description: '/enquire opens the Ask me a question pop-up.' }
      - name: enquiry
        label: Enquiry form section
        type: object
        description: 'Heading beside the form near the bottom of the page (Retreats & events: the proposal form). The questions are under Site settings → Enquiry forms. Leave the title empty to hide.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, description: 'Use *asterisks* for italic.' }
          - { name: intro, label: Intro text, type: text }
      - name: ctaBand
        label: Dark band at the bottom (optional)
        type: object
        description: Leave the title empty to hide.
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - name: primary
            label: Main button
            type: object
            fields:
              - { name: label, label: Button text, type: string }
              - { name: href, label: Link, type: string }
          - name: secondary
            label: Second button (optional)
            type: object
            fields:
              - { name: label, label: Button text, type: string }
              - { name: href, label: Link, type: string }

  # ── OFFERS & PRICES ────────────────────────────────────────────────────────
  - name: offers
    label: Offers & prices
    type: collection
    path: src/content/offers
    format: yaml
    filename: '{primary}.yaml'
    view:
      primary: title
      fields: [title, audience, priceDisplay, price, published]
      sort: [order, title]
    fields:
      - { name: title, label: Offer name, type: string, required: true }
      - { name: showTitle, label: Show the title on the card, type: boolean, default: true, description: 'Untick to hide it. Screen readers still hear it.' }
      - name: audience
        label: Who it's for
        type: select
        required: true
        options:
          values:
            - { value: private, label: Private clients }
            - { value: companies, label: Companies }
            - { value: hospitality, label: Retreats & Events }
            - { value: studios, label: Studios & Clinics }
            - { value: brands, label: Brands }
      - { name: eyebrow, label: Small label above the name, type: string, description: 'e.g. Start here' }
      - { name: summary, label: One-line summary, type: text, description: 'Optional. Leave empty to show just the ticks.' }
      - name: priceDisplay
        label: How to show the price
        type: select
        required: true
        description: '"Tailored proposal" shows no number, so nothing locks you in.'
        options:
          values:
            - { value: exact, label: 'Exact price (e.g. €270)' }
            - { value: from, label: 'From price (e.g. From €340)' }
            - { value: on-request, label: Tailored proposal (no price) }
      - { name: price, label: Price, type: number, description: 'Numbers only, no € sign. Leave empty for Tailored proposal.' }
      - name: currency
        label: Currency
        type: select
        default: EUR
        options:
          values: [EUR, GBP, USD]
      - name: unit
        label: Per
        type: select
        options:
          values:
            - { value: session, label: session }
            - { value: pack, label: pack }
            - { value: month, label: month }
            - { value: programme, label: programme }
            - { value: workshop, label: workshop }
            - { value: day, label: day }
            - { value: person, label: person }
      - name: priceVisibility
        label: Where the price appears
        type: select
        default: web
        options:
          values:
            - { value: web, label: On the website }
            - { value: media-kit, label: Only in downloadable one-sheets }
            - { value: hidden, label: Nowhere (show Tailored proposal) }
      - { name: priceNote, label: Small note under the price, type: string }
      - { name: highlight, label: Highlight badge, type: string, description: 'A short call-out shown as a coloured pill under the price, e.g. Continue & save €40. Leave empty for none.' }
      - { name: includes, label: What's included, type: string, list: true }
      - { name: image, label: Photo (optional), type: image, description: 'Shown on the side of the card (on top on phones).' }
      - { name: imageAlt, label: Photo description, type: string, description: 'Describe the photo for people using screen readers. Needed when there is a photo.' }
      - name: imageFocus
        label: Photo focus
        type: select
        default: center
        description: 'Which part of the photo stays in view when it is cropped to fit.'
        options:
          values:
            - { value: top, label: Top }
            - { value: upper, label: Upper third }
            - { value: center, label: Centre }
            - { value: lower, label: Lower third }
            - { value: bottom, label: Bottom }
            - { value: top-left, label: Top left }
      - name: cta
        label: Button
        type: object
        fields:
          - { name: label, label: Button text, type: string, required: true }
          - { name: href, label: Link, type: string, required: true, description: 'Type whatsapp to use your WhatsApp link from Site settings.' }
      - { name: featured, label: Highlight this offer, type: boolean, description: 'Shown in the dark card.' }
      - { name: order, label: Position, type: number, default: 50, description: 'Lower numbers come first.' }
      - { name: published, label: Show on the website, type: boolean, default: true }

  # ── LEGAL PAGES ─────────────────────────────────────────────────────────────
  - name: legal
    label: Legal pages
    type: collection
    path: src/content/legal
    format: yaml-frontmatter
    filename: '{primary}.md'
    description: 'Each page is published at /<file name>, e.g. terms → /terms.'
    view:
      primary: title
      fields: [title, effective]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: business, label: Business name (under the title), type: string }
      - { name: effective, label: Effective date, type: string, description: 'e.g. 1 May 2026' }
      - { name: description, label: Google description, type: string }
      - { name: body, label: Text, type: rich-text }

  # ── TESTIMONIALS ───────────────────────────────────────────────────────────
  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    format: yaml
    filename: '{primary}.yaml'
    view:
      primary: name
      fields: [name, context, consent, featured]
      sort: [order, name]
    fields:
      - { name: quote, label: Quote, type: text, required: true }
      - { name: name, label: Name as shown, type: string, required: true, description: 'e.g. Sarah M., Head of People at Acme, or Private client.' }
      - { name: context, label: Context, type: string, description: 'e.g. Online Reformer sessions, Lisbon' }
      - name: audiences
        label: Show on pages for
        type: select
        options:
          multiple: true
          values:
            - { value: private, label: Private clients }
            - { value: companies, label: Companies }
            - { value: hospitality, label: Retreats & Events }
            - { value: studios, label: Studios & Clinics }
            - { value: brands, label: Brands }
      - { name: consent, label: I have written permission to publish this, type: boolean, description: 'Without this tick the testimonial never appears.' }
      - { name: featured, label: Feature first, type: boolean }
      - { name: order, label: Position, type: number, default: 50, description: 'Lower numbers come first.' }

  # ── SITE SETTINGS ──────────────────────────────────────────────────────────
  - name: settings
    label: Site settings
    type: file
    path: src/content/settings/site.yaml
    format: yaml
    fields:
      - name: nav
        label: Menu
        type: object
        list: true
        fields:
          - { name: label, label: Menu text, type: string, required: true }
          - { name: href, label: Link, type: string, required: true }
          - { name: external, label: Opens another website, type: boolean }
          - name: children
            label: Drop-down items
            type: object
            list: true
            fields:
              - { name: label, label: Menu text, type: string, required: true }
              - { name: href, label: Link, type: string, required: true }
      - name: availability
        label: Availability badge
        type: object
        description: 'The "Accepting new clients" badge with the pulsing green dot, at the top of the home page.'
        fields:
          - { name: open, label: Accepting new clients, type: boolean, default: true, description: 'Untick when you are fully booked: the dot stops pulsing and the badge shows the waitlist message instead.' }
          - { name: openLabel, label: Text when open, type: string, default: Accepting new clients }
          - { name: closedLabel, label: Text when fully booked, type: string, default: Fully booked · Join the waitlist }
          - { name: href, label: Link when open, type: string, default: /intro-pack }
          - { name: closedHref, label: Link when fully booked, type: string, default: /enquire }
      - name: bookCta
        label: Book button (menu and every "Book your intro pack")
        type: object
        fields:
          - { name: label, label: Button text, type: string, required: true }
          - { name: href, label: Link, type: string, required: true, description: '/intro-pack is the intro pack page.' }
      - { name: stripePublishableKey, label: Stripe publishable key, type: string, required: true, description: 'Starts with pk_. Never paste a secret key (sk_).' }
      - name: introPack
        label: Intro pack page (/intro-pack)
        type: object
        description: 'Where every "Book your intro pack" button leads: a few lines, then your intro-only Stripe pricing table.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
          - { name: intro, label: Intro text, type: text }
          - { name: points, label: Numbered steps, type: string, list: true, description: 'What happens after paying, one short line each.' }
          - { name: stripePricingTableId, label: Stripe pricing table ID (intro only), type: string, required: true, description: 'Starts with prctbl_ (Stripe → Pricing tables → Copy code).' }
      - name: monthlyPlans
        label: Monthly plans page (/monthly-plans, for existing clients)
        type: object
        description: 'Linked from nowhere on the site and hidden from Google: send the link to clients yourself.'
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
          - { name: intro, label: Intro text, type: text }
          - { name: stripePricingTableId, label: Stripe pricing table ID (monthly plans), type: string, description: 'A second table with the monthly plans. Starts with prctbl_. Leave empty to show the message below instead.' }
          - { name: noTableText, label: Message when there is no table, type: text, required: true }
      - name: welcome
        label: Welcome page (/welcome, after paying)
        type: object
        description: 'Set this page in Stripe as where people go after paying (pricing table → after payment → redirect to your website).'
        fields:
          - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
          - { name: intro, label: Intro text, type: text }
          - { name: bookingTitle, label: Booking step title, type: string, required: true }
          - { name: bookingText, label: Booking step text, type: text }
          - { name: bookingHref, label: Your booking link, type: string, description: 'Google Calendar booking page, Calendly… Opens in a new tab. Leave empty to show the line below instead.' }
          - { name: bookingLabel, label: Booking button text, type: string, required: true }
          - { name: bookingFallback, label: Line when there is no booking link, type: text, required: true }
          - { name: intakeTitle, label: Intake step title, type: string, required: true }
          - { name: intakeText, label: Intake step text, type: text }
      - name: contact
        label: WhatsApp link
        type: object
        description: 'Shown as a small "Prefer WhatsApp?" link under every form. It opens WhatsApp directly. Leave empty to hide it.'
        fields:
          - { name: whatsappHref, label: Your WhatsApp link, type: string, description: 'Your wa.me or wa.link address.' }
          - { name: whatsappLabel, label: Link text, type: string, default: Message me on WhatsApp }
      - name: enquiry
        label: Enquiry forms
        type: object
        description: 'Answers arrive in your inbox by email. question: the Ask me pop-up and /enquire. proposal: the Retreats & events page. intake: the welcome page after paying.'
        fields:
          - { name: nameLabel, label: Name field label, type: string, default: Name }
          - { name: emailLabel, label: Email field label, type: string, default: Email }
          - { name: replyPromise, label: Reply promise under the send button, type: string, description: 'Only promise what you can keep, e.g. I reply personally within one working day.' }
          - { name: privacyNote, label: Privacy line, type: string, description: 'Shown before the Privacy policy link under the send button.' }
          - { name: success, label: Message after sending, type: text, required: true }
          - { name: error, label: Message if sending fails, type: text, required: true }
          - { name: turnstileSiteKey, label: Turnstile site key (spam check), type: string, description: 'From Cloudflare → Turnstile. Leave empty until it is set up.' }
          - name: forms
            label: Forms
            type: object
            fields:
              - name: question
                label: Question form (Ask me pop-up and /enquire)
                type: object
                fields:
                  - { name: title, label: Title, type: string, required: true, description: 'Use *asterisks* for italic.' }
